[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
# A hung test used to stall the entire run with no output, which meant
# nobody could get a full regression result (2026-08-22). Bound every
# test; 120s is well clear of the slowest legitimate one (~50s), and the
# thread method dumps stacks for all threads so a hang is diagnosable.
timeout = 120
timeout_method = thread
markers =
    integration: tests that require a live Postgres (select with -m integration)
    unit: pure logic tests, no DB required
    real_llm: lets the test reach a real LLM provider (chatgpt.com, openai.com, anthropic.com); conftest refuses it for every other test
